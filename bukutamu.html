            <h2>Buku Tamu</h2>
            <p>Isi pesan dan kesan kamu buat aku disini yaa 💕</p>
            <br>
            <table border="1" width="50%" cellpadding="12" cellspacing="0" bordercolor="#cccccc" bgcolor="#f0f4c3">
                <tr>
                    <td>
                        <form action="#" method="GET">
                            <table border="1" width="100%" cellpadding="8" cellspacing="0" bordercolor="#dddddd" bgcolor="#ffffff">
                                <tr>
                                    <td width="30%"><label for="nama">Nama</label></td>

                                <tr>
                                    <td><label for="email">Email</label></td>
                                    <td><input type="email" id="email" name="email" required size="35"></td>
                                </tr>
                                <tr>

                                    <td>
                                        <input type="radio" id="pria" name="jenis_kelamin" value="Laki-laki">

                                        <input type="radio" id="wanita" name="jenis_kelamin" value="Perempuan">
                                        <label for="wanita">Perempuan</label>
                                    </td>
                                </tr>
                                <tr>
                                    <td valign="top"><label for="pesan">Pesan/Kesan</label></td>
                                    <td>
                                        <textarea id="pesan" name="pesan" rows="6" cols="35" required></textarea>
                                    </td>
                                </tr>
                            </table>
                            <br>
                            <center>
                                <input type="submit" value="Kirim">
